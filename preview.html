<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山境 v2 预览</title>
<style>
:root{--bg:#0b0f14;--panel:#121820;--line:#243040;--text:#e9edf1;--muted:#8d9aa8;--accent:#ffcf7a;--accent-ink:#1b1408}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
main{max-width:1120px;margin:auto;padding:40px 32px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--muted)}
h1{margin:6px 0 0;font-weight:600;font-size:26px}
h1 span{color:var(--muted);font-weight:400;font-size:18px;margin-left:8px}
.badge{border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start;padding-top:36px}
.watch{position:relative;width:min(100%,470px);aspect-ratio:1;margin:0 auto;border-radius:50%;padding:18px;
  background:radial-gradient(circle at 30% 25%,#3a424c,#151a20 60%,#0b0e12);box-shadow:0 30px 70px #000a,inset 0 0 0 1px #4a535e}
.watch canvas{width:100%;height:100%;border-radius:50%;display:block;background:#000}
.phase{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;min-height:20px}
.controls{display:flex;flex-direction:column;gap:22px}
.group h3{margin:0 0 9px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:64px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button:hover{border-color:#3b4b5e}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.ghost{background:none;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.note{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:820px){main{padding:24px 16px}.layout{grid-template-columns:1fr;gap:32px}.badge{display:none}}
body.face-only main{padding:0;max-width:none}
body.face-only header,body.face-only .controls,body.face-only .phase{display:none}
body.face-only .layout{display:block;padding:0}
body.face-only .watch{width:470px;margin:0;box-shadow:none}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">EPIX PRO 51MM · 454 × 454 · CONNECT IQ</div><h1>山境<span>Mountain v2</span></h1></div>
    <span class="badge">望山-X 方向 · 与手表共用字体、山景与日历数据</span>
  </header>
  <div class="layout">
    <section>
      <div class="watch"><canvas id="face" width="454" height="454" aria-label="山境表盘预览"></canvas></div>
      <div class="phase" id="phase"></div>
    </section>
    <section class="controls">
      <div class="group"><h3>时间</h3>
        <div class="row"><input id="time" type="range" min="0" max="1439" step="1"><span class="time" id="timeLabel"></span></div>
        <div class="row" style="margin-top:10px"><button class="ghost" id="dayLapse">快放一整天</button><button class="ghost" id="now">回到现在</button></div>
      </div>
      <div class="group"><h3>天空</h3><div class="seg" data-key="sky"></div></div>
      <div class="group"><h3>天气</h3><div class="seg" data-key="weather"></div></div>
      <div class="group"><h3>状态</h3><div class="seg" data-key="preset"></div></div>
      <div class="group"><h3>活动日</h3><div class="seg" data-key="festival"></div></div>
      <div class="group"><h3>季节</h3><div class="seg" data-key="season"></div></div>
      <div class="group"><h3>强调色</h3><div class="seg" data-key="accent"></div></div>
      <div class="group"><h3>动效</h3><div class="seg" data-key="motion"></div></div>
      <div class="row"><button class="primary" id="wake">抬腕</button><span class="note" style="border:0;padding:0">按手表节奏：入场动画 → 约 10 秒常亮 → 进入息屏</span></div>
      <p class="note">预览与原生表盘使用同一份山景、字体和农历/节气数据，绘制函数逐一对应；弧形文字在手表上用系统矢量字体，位置略有差异。数值为演示数据；手表上的日出日落、天气、心率、海拔、身体电量、压力都来自系统。</p>
    </section>
  </div>
</main>
<script src="preview-render.js"></script>
<script>
const OPTIONS = {
  sky: [['自动', 0], ['清晨', 1], ['白昼', 2], ['黄昏', 3], ['夜晚', 4]],
  weather: [['晴', 0], ['少云', 1], ['多云', 2], ['雨', 3], ['雪', 4], ['雾', 5], ['雷雨', 6]],
  preset: [['日常', 'normal'], ['步数达标', 'goal'], ['低电充电', 'battery'], ['通知/久坐', 'alert'], ['压力高', 'stress'], ['缺数据', 'missing'], ['12 小时制', 'h12']],
  motion: [['丰富', 0], ['简洁', 1], ['关闭', 2]],
  festival: [['按日期', -1], ['正月', 7], ['节分', 15], ['除夕', 6], ['春节', 1], ['元宵', 2], ['情人节', 8], ['女儿节', 16], ['赏樱', 17], ['清明', 14], ['复活节', 22], ['男孩节', 18], ['儿童节', 9], ['端午', 10], ['七夕·和', 19], ['七夕', 11], ['盂兰盆', 20], ['中秋', 3], ['重阳', 12], ['万圣', 5], ['红叶', 21], ['圣诞', 4], ['跨年', 13]],
  season: [['按日期', -1], ['春', 0], ['夏', 1], ['秋', 2], ['冬', 3]],
  accent: [['琥珀', 0], ['青', 1], ['樱', 2], ['雪', 3]],
};
const ui = { sky: 0, weather: 1, preset: 'normal', motion: 0, festival: -1, season: -1, accent: 0, minutes: null };
const params = new URLSearchParams(location.search);
for (const k of Object.keys(OPTIONS)) if (params.has(k)) ui[k] = isNaN(params.get(k)) ? params.get(k) : +params.get(k);
if (params.has('t')) { const [h, m] = params.get('t').split(':'); ui.minutes = +h * 60 + +m; }
if (params.has('face')) document.body.classList.add('face-only');

const canvas = document.getElementById('face'), ctx = canvas.getContext('2d');
let wakeAt = performance.now() - 60000, lapse = null;
const DEMO_DATE = { year: 2026, month: 10, day: 23, weekday: 6 };

function state() {
  const now = new Date();
  const mins = ui.minutes ?? now.getHours() * 60 + now.getMinutes();
  const p = ui.preset;
  return {
    hour: Math.floor(mins / 60), min: mins % 60, sec: now.getSeconds(), is24: p !== 'h12',
    ...DEMO_DATE, sunrise: 6 * 3600 + 3 * 60, sunset: 17 * 3600 + 12 * 60,
    weatherClass: ui.weather, weatherFx: true, temp: ui.weather === 4 ? -3 : 16,
    hr: p === 'missing' ? null : 64, steps: p === 'missing' ? null : p === 'goal' ? 10432 : 6842, stepGoal: 10000,
    bodyBattery: p === 'missing' ? null : 72, battery: p === 'battery' ? 14 : 82, charging: p === 'battery',
    notifications: p === 'alert' ? 3 : 0, phone: p !== 'alert', dnd: false, moveBar: p === 'alert' ? 2 : 0,
    calories: p === 'missing' ? null : 1840, altitude: p === 'missing' ? null : 128, stress: p === 'stress' ? 82 : 31,
    sky: ui.sky, motion: ui.motion, aod: params.has('aod'), accent: ui.accent,
    festival: ui.festival < 0 ? null : ui.festival, season: ui.season < 0 ? null : ui.season,
  };
}
function label(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function build() {
  for (const el of document.querySelectorAll('.seg')) {
    const key = el.dataset.key; el.innerHTML = '';
    for (const [text, val] of OPTIONS[key]) {
      const b = document.createElement('button'); b.textContent = text; b.setAttribute('aria-pressed', ui[key] === val);
      b.onclick = () => { ui[key] = val; build(); if (key !== 'motion') wake(); else wake(); }; el.append(b);
    }
  }
  const s = state(), m = s.hour * 60 + s.min;
  document.getElementById('time').value = m; document.getElementById('timeLabel').textContent = label(m);
}
function wake() { wakeAt = performance.now(); meteorAt = ui.motion === 0 && Math.random() < .67 ? 2 + Math.random() * 4 : null; }
let meteorAt = null, lastFrame = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = (ts - wakeAt) / 1000;
  const awake = t < 10 || params.has('face');
  const fps = t < 1.4 ? 20 : ui.motion === 0 ? 15 : 1;
  if (ts - lastFrame < 1000 / fps - 2 && !lapse) return; lastFrame = ts;
  if (lapse) { ui.minutes = (ui.minutes + 6) % 1440; document.getElementById('time').value = ui.minutes; document.getElementById('timeLabel').textContent = label(ui.minutes); }
  const s = state(); if (!awake && !params.has('face')) s.aod = true;
  const intro = ui.motion === 2 || params.has('face') ? 1 : Math.min(1, t / 1.4);
  Face.render(ctx, s, { intro, t: params.has('face') ? +(params.get('anim') || 3) : t, meteorAt: params.has('meteor') ? 0 : meteorAt });
  document.getElementById('phase').textContent = s.aod ? '息屏常显：线稿时间，每分钟位移，亮像素约 3%' : t < 1.4 && ui.motion !== 2 ? '入场动画' : '常亮 · ' + (ui.motion === 0 ? '环境动效 15 fps' : '每秒刷新');
}
document.getElementById('time').oninput = e => { ui.minutes = +e.target.value; lapse = null; document.getElementById('timeLabel').textContent = label(ui.minutes); wakeAt = performance.now() - 2000; };
document.getElementById('dayLapse').onclick = () => { if (lapse) { lapse = null; return; } ui.minutes = ui.minutes ?? 300; lapse = true; wakeAt = performance.now() - 2000; };
document.getElementById('now').onclick = () => { ui.minutes = null; lapse = null; build(); wake(); };
document.getElementById('wake').onclick = wake;
(async () => {
  await Face.load(window.EMBEDDED_DATA || 'preview-data.json', n => (window.EMBEDDED_FONTS || {})[n] || `resources/fonts/${n}.png`);
  if (ui.minutes == null && !params.has('t')) ui.minutes = 17 * 60 + 2;
  build(); wake(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
